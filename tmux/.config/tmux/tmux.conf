# --- General ---
set -g default-terminal "tmux-256color"
# true colour + undercurls (Ghostty)
set -as terminal-features ",xterm-ghostty:RGB:usstyle:hyperlinks"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g detach-on-destroy off
set -g status-interval 5

# --- Prefix: C-a ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Keys ---
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded tmux.conf"

# splits open in the current directory
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-style pane navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# C-h/j/k/l move between nvim splits and tmux panes (vim-tmux-navigator);
# C-l is taken, so clear the screen with prefix + C-l
bind C-l send-keys C-l

# swap windows left/right
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# pick a window and pull its pane in here (undoes prefix + ! break-pane)
bind @ choose-window 'join-pane -h -s "%%"'

# vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Plugins (tpm) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'

# --- Theme: Catppuccin Macchiato (must be set before the plugin loads) ---
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_directory}"

# --- Run tpm (keep at the very bottom) ---
run '~/.config/tmux/plugins/tpm/tpm'

# transparent status bar, like the terminal (after the theme loads)
set -g status-style "bg=default"
# no underline/reverse leaking onto window names
set -g window-status-style "none"
set -g window-status-current-style "none"
set -g window-status-last-style "none"
